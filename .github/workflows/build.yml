name: Build Pico 2 UF2

on:
  push:
    paths:
      - 'pico_fw/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - name: Build
        working-directory: pico_fw
        env:
          PICO_SDK_FETCH_FROM_GIT: '1'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Publish UF2
        uses: actions/upload-artifact@v4
        with:
          name: xbox-jewel-uf2
          path: pico_fw/build/xbox_jewel.uf2
