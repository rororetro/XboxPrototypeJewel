name: Build Pico 2 UF2

on:
  push:
    paths:
      - 'pico_fw/**'
      - '.github/workflows/build-uf2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check animation
        run: |
          test -s pico_fw/include/images/animation.h
          grep -q 'static const uint8_t' pico_fw/include/images/animation.h

      - name: Install Pico toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure
        env:
          PICO_SDK_FETCH_FROM_GIT: "1"
        run: cmake -S pico_fw -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Verify UF2
        run: |
          ls -lh build/xbox_jewel.uf2
          test -f build/xbox_jewel.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: xbox-jewel-uf2
          path: build/xbox_jewel.uf2
