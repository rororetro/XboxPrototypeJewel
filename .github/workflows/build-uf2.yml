name: Build Pico 2 UF2

on:
  push:
    paths:
      - 'pico_fw/**'
      - 'animation-source/**'
      - '.github/workflows/build-uf2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate animation header
        run: |
          test -s animation-source/animation.bin.gz
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          data = gzip.decompress(Path("animation-source/animation.bin.gz").read_bytes())
          out = Path("pico_fw/include/images/animation.h")
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("w") as f:
              f.write("static const uint8_t __attribute__((aligned(4))) animation[] = {\n")
              for i in range(0, len(data), 16):
                  f.write("    " + ", ".join(f"0x{b:02x}" for b in data[i:i+16]) + ",\n")
              f.write("};\n")
          print(f"animation: {len(data)} bytes")
          PY

      - name: Install Pico toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure
        env:
          PICO_SDK_FETCH_FROM_GIT: "1"
        run: cmake -S pico_fw -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Verify UF2
        run: |
          ls -lh build/xbox_jewel.uf2
          test -f build/xbox_jewel.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: xbox-jewel-uf2
          path: build/xbox_jewel.uf2
